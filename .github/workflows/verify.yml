name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_APP_ENV: test
      EXPO_PUBLIC_USE_MOCKS: 'true'
      EXPO_PUBLIC_BACKEND_PROVIDER: firebase
      EXPO_PUBLIC_FIREBASE_API_KEY: mock-api-key
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: mock.firebaseapp.com
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: mock-project
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: mock.appspot.com
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      EXPO_PUBLIC_FIREBASE_APP_ID: mock-app-id
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify environment
        run: npm run verify:env

      - name: Run QA tests
        run: npm run qa:test

      - name: Run Firestore security rules emulator tests
        run: npm run test:firestore-rules

      - name: Run unit tests
        run: npm run unit:test --if-present

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Export web build
        run: npm run export:web
